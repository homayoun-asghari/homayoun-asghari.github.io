name: Copy homayoun.me

# Once a day, and whenever run by hand from the Actions tab.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Refuses, and changes nothing, if the site is down or looks wrong.
      - run: python3 -I mirror.py docs

      - name: Keep the copy in the repository
        run: |
          git config user.name "site-mirror"
          git config user.email "site-mirror@users.noreply.github.com"
          git add -A docs
          git diff --cached --quiet || git commit -m "Copy of homayoun.me, $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
